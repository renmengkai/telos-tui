[package]
name = "telos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "telos"
path = "src/main.rs"

[dependencies]
ratatui   = "0.29"
crossterm = "0.28"
tokio     = { version = "1", features = ["full"] }
reqwest   = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = { version = "0.8", features = ["parse"] }

[dev-dependencies]
tempfile = "3"
